command:
  - python
  - -m
  - ppo_vmap.ppo
  - ${args}
name: big-ppo-sweep-random-navix::Navix-SimpleCrossingS9N1-v0
method: random
run_cap: 50
metric:
  name: episode/return
  goal: maximize

parameters:
  # --- Fixed Parameters ---
  total_timesteps:
    value: 100663296  # 2^25 * 3
  wandb_entity:
    value: flair
  wandb_project:
    value: big-ppo-sweep
  use_wandb:
    value: True
  env_name:
    value: navix::Navix-SimpleCrossingS9N1-v0
  seed:
    value: 0
  stagger_steps:
    value: 1
  pool_size:
    value: 16
  num_runs:
    value: 8
  num_checkpoints:
    value: 1
  optimizer:
    value: adamw
  adam_epsilon:
    value: 1e-5
  policy_wd:
    value: 0.0001
  value_wd:
    value: 0.0001
  use_symlog:
    value: False

  # --- Swept Hyperparameters ---
  policy_lr:
    values: [1e-4, 3e-4, 1e-3, 3e-3]
  value_fn_lr:
    values: [1e-4, 3e-4, 1e-3, 3e-3]
  gamma:
    values: [0.9, 0.95, 0.99, 0.999]
  gae_lambda:
    values: [0.3, 0.5, 0.8, 0.9, 0.95, 0.97, 0.99]
  entropy_coef:
    values: [0.0, 0.001, 0.01, 0.05]
  epsilon:
    values: [0.1, 0.2, 0.3, 0.5]
  num_epochs:
    values: [3, 5, 10, 15]
  num_minibatches:
    values: [4, 8, 16, 32]
  num_steps:
    values: [16, 32, 64, 128, 256]
  num_envs:
    values: [512, 1024, 2048]
  layer_size:
    values: [64, 128, 256, 512]
  num_layers:
    values: [2, 3, 4]
  activation:
    values: [tanh, relu, swish]
  layer_norm:
    values: [True, False]
  init:
    # orthogonal/variance_scaling for tanh; he/xavier used automatically for relu/swish
    values: [orthogonal, variance_scaling]
  initial_log_std:
    values: [-1.5, -1.0, -0.5, 0.0]
  normalize_observations:
    values: [True, False]
  normalize_rewards:
    values: [True, False]
  anneal_lr:
    values: [True, False]

  # --- Potential Future Parameters ---
  # shared_backbone:  # whether actor and critic share a trunk (might add later)
  #   values: [True, False]
  # cnn_fc_size:  # size of FC layer after CNN (might add later)
  #   values: [256, 512, 1024]
  # conv_layers:  # number of conv layers (might add later)
  #   values: [3, 4]
  # conv_channels:  # channels per conv layer (might add later)
  #   values: [32, 64, 128]
